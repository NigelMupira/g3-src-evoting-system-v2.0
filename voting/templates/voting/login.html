{% extends "voting/base.html" %}
{% block content %}

<div class="login-box">
    <div class="login-logo">
        <b>HIT SRC ELECTIONS</b>
    </div>

    <div class="login-box-body">
        <form action="{% url 'account_login' %}" method="POST">
            {% csrf_token %}
            <div class="form-group has-feedback">
                <input type="text" class="form-control" name="email" placeholder="Email" required>
                <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
            </div>
            <div class="form-group has-feedback">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
                <span class="glyphicon glyphicon-lock form-control-feedback"></span>
            </div>
            <div class="row">
                <div class="col-xs-4">
                    <button type="submit" class="btn btn-success btn-block btn-flat" name="login">
                        <i class="fa fa-sign-in"></i> Log In
                    </button>
                </div>
                <div class="pull-right col-xs-4">
                    <a class="btn btn-warning btn-block btn-flat" href="{% url 'account_register' %}">
                        <i class="fa fa-user-plus"></i> Register
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

<style>
    /* Sky blue color background */
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        background-color: #87CEEB; /* Sky Blue */
        animation: skyBlueAnimation 10s ease infinite;
    }

    .login-logo {
        background-color: #28a745;
        color: aliceblue;
        padding: 10px;
        border-radius: 10px 10px 0 0;
        text-align: center;
        font-size: 24px;
    }

    .login-box {
        background-color: aliceblue;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        width: 400px;
        transition: transform 0.3s, box-shadow 0.3s;
        position: relative;
        z-index: 2;
    }

    .login-box:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Input fields glowing on hover and focus */
    .form-control {
        transition: box-shadow 0.3s, border-color 0.3s;
        border: 1px solid #ced4da;
    }

    .form-control:hover {
        box-shadow: 0 0 8px 2px #28a745; /* green glow on hover */
        border-color: #28a745;
    }

    .form-control:focus {
        box-shadow: 0 0 8px 2px #007bff; /* blue glow when typing */
        border-color: #007bff;
        outline: none;
    }

    .btn-success {
        background-color: #28a745;
        border: none;
    }

    .btn-success:hover {
        background-color: #1e7e34;
        color: white;
    }

    .btn-warning {
        background-color: #ffc107;
        border: none;
    }

    .btn-warning:hover {
        background-color: #e0a800;
        color: white;
    }

    /* Animation for smooth transition of sky blue */
    @keyframes skyBlueAnimation {
        0% {
            background-color: #87CEEB; /* Sky Blue */
        }
        50% {
            background-color: #00BFFF; /* Deep Sky Blue */
        }
        100% {
            background-color: #87CEEB; /* Sky Blue */
        }
    }
</style>

{% endblock content %}
